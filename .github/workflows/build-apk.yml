name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew testReleaseUnitTest
      - name: Signing key (optional secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ARC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/sideload.keystore
          fi
      - name: Build APK
        env:
          ARC_KEYSTORE_PASSWORD: ${{ secrets.ARC_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: x-manager-apk
          path: app/build/outputs/apk/release/app-release.apk
